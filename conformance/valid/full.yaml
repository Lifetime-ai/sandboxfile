apiVersion: sandboxfile.dev/v1alpha1
kind: Sandbox
metadata:
  name: full
  description: Exercises every v1alpha1 section
  labels:
    conformance: full
environment:
  image: node:22-bookworm
  workdir: /workspace/project
  user: node
  entrypoint: [/bin/sh, -lc]
  env:
    CI: "true"
resources:
  cpu:
    request: 500m
    limit: "2"
  memory:
    request: 1Gi
    limit: 4Gi
  disk:
    limit: 20Gi
  processes:
    limit: 256
lifecycle:
  ttl: 2h
  idleTimeout: 20m
  cleanup: destroy
sources:
  primary:
    type: context
    path: /workspace/project
    access: read-write
  repositories:
    - name: docs
      type: git
      url: https://github.com/Lifetime-ai/sandboxfile.git
      ref: main
      path: /workspace/docs
      access: read-only
setup:
  bootstrap:
    - npm ci
  ready:
    command: node --version
    timeout: 1m
tasks:
  test:
    command: npm test
    timeout: 20m
  build:
    command: npm run build
    timeout: 20m
    dependsOn: [test]
network:
  default: deny
  allow:
    - host: registry.npmjs.org
      protocols: [https]
  ingress:
    - name: preview
      port: 3000
      visibility: private
      protocol: http
credentials:
  - name: github
    provider: github
    permissions:
      contents: read
    repositories:
      - Lifetime-ai/sandboxfile
    delivery: proxy
capabilities:
  shell: true
  browser: true
  privileged: false
  hostMounts: false
  containerRuntime: false
persistence:
  caches:
    - name: npm
      path: /home/node/.npm
      scope: project
      retention: 7d
outputs:
  artifacts:
    - name: tests
      path: test-results/**
      retention: 7d
  evidence:
    commands: true
    gitDiff: true
    tests: true
    resourceUsage: true
    networkAccess: true
extensions:
  example.dev/traceMode:
    critical: true
    value: strict
