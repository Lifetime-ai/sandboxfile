name: Specification proposal
description: Propose a field, semantic, compatibility, or security change
title: "Proposal: "
labels:
  - proposal
body:
  - type: markdown
    attributes:
      value: |
        Significant specification changes should become a proposal under `proposals/`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What portable agent-computer problem is not covered today?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed contract
      description: Describe fields, defaults, and runtime semantics.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Authority and security
      description: What authority is requested and how does enforcement fail closed?
    validations:
      required: true
  - type: textarea
    id: providers
    attributes:
      label: Provider portability
      description: How could at least two providers implement this?
    validations:
      required: true
