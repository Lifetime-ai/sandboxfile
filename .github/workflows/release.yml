name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 15

    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Verify alpha tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$RELEASE_TAG" in
            v0.1.0-alpha.*) ;;
            *) echo "Refusing non-alpha tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          export EXPECTED_VERSION="${RELEASE_TAG#v}"
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const expected = process.env.EXPECTED_VERSION;
            for (const path of [
              "package.json",
              "packages/typescript/package.json",
              "packages/validator/package.json"
            ]) {
              const value = JSON.parse(await readFile(path, "utf8")).version;
              if (value !== expected) {
                throw new Error(`${path} has ${value}; expected ${expected}`);
              }
            }
          '

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release contents
        run: pnpm check

      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@11.18.0

      - name: Publish schema
        run: npm publish --access public --tag next

      - name: Publish generated types
        working-directory: packages/typescript
        run: npm publish --access public --tag next

      - name: Publish validator
        working-directory: packages/validator
        run: npm publish --access public --tag next
